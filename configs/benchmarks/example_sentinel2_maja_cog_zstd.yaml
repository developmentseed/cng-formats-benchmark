# Example fan-out benchmark: Sentinel-2 L2A MAJA as COG, matched-codec arm (#72).
#
# Identical to example_sentinel2_maja_cog.yaml except for `codec: zstd`. The CNES
# D2 review found the GeoZarr-vs-COG size gap (~25% on S1/S2) compared deflate
# COG against zstd GeoZarr — a codec difference, not a format one. Running this
# arm alongside example_sentinel2_maja_geozarr.yaml (also zstd) isolates the
# residual gap to the format/overviews; keep the deflate config as the baseline.
# Also the display comparison partner for that arm (#116): both set the *same*
# display_target_resolutions, so a display_res_60m_latency (etc.) figure
# means the same ground resolution regardless of format — COG's own overview
# ladder (naive halving) wouldn't otherwise land on the same resolutions as
# GeoZarr's #107/#108 target ladder.
id: example-sentinel2-l2a-cog-zstd
dataset: example-sentinel2-l2a-maja
formats:
  - cog
metrics:
  - write
  - object_size
  - read
  - display
tiers:
  - name: warm
    min_object_bytes: 33554432    # 32 MiB
  - name: cold
    min_object_bytes: 104857600   # 100 MiB
params:
  block_size: 512
  codec: zstd                     # matched against the GeoZarr arm's codec
  scope: product-set              # one scene (product) | many (product-set)
  products:
    prefix: "2015/"               # bound which scenes the set covers
    limit: 3
  samples:
    read: 1                       # sample one component per product for read
    display: 1
  # Same values as example_sentinel2_maja_geozarr(_reader).yaml's GeoZarr
  # ladder (#107, #108) — the display comparison's whole point (#116).
  display_target_resolutions: [20, 60, 120, 360, 720]
