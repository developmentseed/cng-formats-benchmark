# Example benchmark arm: SWOT LakeSP -> GeoParquet, brotli codec (#73).
#
# Identical to example_swot_lakesp_geoparquet.yaml except for `compression:
# brotli` — the other alternative codec the issue asks to sweep alongside
# zstd, to check whether it closes the CNES D2 review's +14%-vs-shapefile
# size gap any further than the zstd baseline.
#
# Run with `--dataset configs/datasets/example_swot_lakesp_prior.yaml` (chart:
# runner.datasetFile). `output` is supplied by the deployment.
id: example-swot-lakesp-geoparquet-brotli
dataset: example-swot-lakesp-prior
formats:
  - geoparquet
metrics:
  - write
  - object_size
  - read
tiers:
  - name: tier2-disk
    min_object_bytes: 33554432    # 32 MiB
  - name: tier3-tape
    min_object_bytes: 104857600   # 100 MiB
params:
  row_group_rows: 50000
  spatial_partitioning: true
  compression: brotli              # the codec-sweep alternative (#73)
  scope: product-set     # product (one pass) | product-set (many)
  products:
    prefix: ""
    limit: 3
  samples:
    read: 1
