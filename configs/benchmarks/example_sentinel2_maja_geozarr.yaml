# Example benchmark arm: Sentinel-2 L2A MAJA -> GeoZarr v3 (bundled, 2D).
#
# The M2.5 second-format arm on the same mission as the COG arm. MAJA's
# reflectance bands / masks (picked in the dataset `options`) are bundled into
# one sharded 2D GeoZarr store per product (`bundle_components: true`):
# components are grouped by native pixel grid, which already separates MAJA's
# 10 m reflectance/R1 masks from its 20 m R2 masks one group per native
# resolution (#107), and every component — 10 m and 20 m alike — gets its own
# full chain of overview levels down to the coarsest target resolution,
# landing as a sibling array in each shared level group alongside every other
# applicable component (#112): a 10 m band's own overviews are never
# redundant with the 20 m tier's, since they hold a *different physical
# quantity* — a client can't read one in place of a coarse view of the other.
# Profiles the per-product object-size distribution + a set-level roll-up —
# the head-to-head structural comparison against the COG arm, from the same
# canonical source.
#
# Run with `--dataset configs/datasets/example_sentinel2_maja.yaml` (chart:
# runner.datasetFile). The component picks are NOT here — they live in the dataset
# descriptor. `output` (and the TiTiler endpoint for display) are supplied by the
# deployment. Time-stacking the scenes into a 3D cube is a deferred follow-up; this
# arm is the 2D, resolution-bundled base case.
id: example-sentinel2-l2a-maja-geozarr
dataset: example-sentinel2-l2a-maja
formats:
  - geozarr
metrics:
  - write
  - object_size
  - read
  - display
tiers:
  - name: tier2-disk
    min_object_bytes: 33554432    # 32 MiB
  - name: tier3-tape
    min_object_bytes: 104857600   # 100 MiB
params:
  # Zarr v3 sharding is the object-grouping lever (chunk = addressable unit,
  # shard = stored object). chunk_shape is the read-path granularity settled
  # on by the parameter-discovery notebook; shard_shape is "auto" — rounded
  # up to one chunk multiple that covers each level's own array, so one
  # level is always one shard, whether or not that level's extent happens to
  # be an exact multiple of the chunk. #107/#109 mean one bundled store can
  # hold several resolution groups (10 m, 20 m, …), each its own extent —
  # a single hand-picked shard number can't be correct for all of them at
  # once the way it could when there was only one grid to tune for (#111).
  chunk_shape: [1024, 1024]
  shard_shape: auto
  codec: zstd
  # Overview pyramid, anchored on the EOPF S1-tiling/S2 cross-mission target
  # ladder (10 m native -> 20 -> 60 -> 120 -> 360 -> 720 m; #107, #108),
  # matching the S1 RTC arm so a viewer built against one product's pyramid
  # shape works against the other unmodified. "20" matches MAJA's own real
  # 20 m R2-mask tier (used as real data, not synthesized, #112) — every
  # bundled component, 10 m and 20 m alike, gets its own full chain through
  # every one of these levels, so a coarse-zoom read never comes up empty
  # for whichever band happens not to be the coarsest tier (#112).
  multiscale_levels: [20, 60, 120, 360, 720]
  # Group this product's components by native pixel grid — MAJA's 10 m
  # reflectance/R1 masks and 20 m R2 masks land in separate groups for free
  # (grid equality), which the unified pyramid above anchors on rather than
  # every component fabricating its own from-scratch overview chain (#107,
  # mitigates the per-component object fragmentation from #105).
  bundle_components: true
  # Encode MAJA's reflectance quantification (DN = reflectance x 10000) in the
  # array's own codec pipeline (`scale_offset` + `cast_value`) instead of leaving
  # it as side metadata. The array then reads back as physical reflectance for
  # *any* Zarr client, while the int16 count is still what occupies the shard —
  # so the sizes stay comparable with the COG arm, where the same scale is
  # out-of-band metadata a client has to find and apply. This is the
  # encoding-semantics differentiator the study demonstrates (#54). It is a no-op
  # for the masks, which carry no scale.
  scale_offset: true
  scope: product-set     # product (one scene) | product-set (many)
  products:
    prefix: ""
    limit: 3
  samples:
    read: 1
    display: 1
  # GeoZarr display is served by the bench tiler's stock-xarray router at
  # /zarr, not the COG endpoints; set to "geozarr" to compare against its
  # GeoZarrReader-backed router instead (#88).
  display_titiler_path: zarr
  # Same values as example_sentinel2_maja_cog_zstd.yaml's COG arm (#116) —
  # one tile per target resolution, shared across the format pair so a
  # display_res_60m_latency (etc.) figure is directly comparable, not
  # an accidental mix of two formats' own differently-anchored overview
  # ladders. Matches this arm's own multiscale_levels above.
  display_target_resolutions: [20, 60, 120, 360, 720]
