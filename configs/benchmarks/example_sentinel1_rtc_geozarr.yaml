# Example benchmark arm: Sentinel-1 RTC (gamma0) -> GeoZarr v3 (bundled, 2D).
#
# The RTC analogue of example_sentinel2_maja_geozarr.yaml, but structurally
# simpler: VV and VH are two measurements of the identical grid, not two
# different native resolutions (#108, companion to #107's S2 case), so
# `bundle_components: true` puts them in one grid group sharing coordinates,
# no resolution-grouping logic needed. The reference EOPF `s1-tiling`
# ingestion also bundles a border/validity mask as a third component, but a
# real S1Tiling delivery listing has no equivalent raster to add (see
# `datasets/sentinel1.py`'s reader docstring) — VV+VH is the whole bundle
# here. Unlike MAJA, RTC gamma0 is not a packed/scaled product, so
# `scale_offset` does not apply here; the reader supplies `standard_name`
# (backscatter coefficient) per component.
#
# Run with `--dataset configs/datasets/example_sentinel1_rtc.yaml`. `output`
# (and the TiTiler endpoint for display) are supplied by the deployment.
id: example-sentinel1-rtc-geozarr
dataset: example-sentinel1-rtc
formats:
  - geozarr
metrics:
  - write
  - object_size
  - read
  - display
tiers:
  - name: tier2-disk
    min_object_bytes: 33554432    # 32 MiB
  - name: tier3-tape
    min_object_bytes: 104857600   # 100 MiB
params:
  # Zarr v3 sharding is the object-grouping lever (chunk = addressable unit,
  # shard = stored object); chunk_shape mirrors the MAJA GeoZarr arm's
  # read-path granularity. shard_shape is "auto" — rounded up to one chunk
  # multiple that covers the whole array, so one level is always one shard
  # rather than depending on the array happening to be an exact chunk
  # multiple, which a hand-picked number silently stops being for a
  # different tile/product generation/mission (#111).
  chunk_shape: [1024, 1024]
  shard_shape: auto
  codec: zstd                     # matched against the COG arm's codec (#72)
  # Overview pyramid anchored on the EOPF S1-tiling/S2 cross-mission target
  # ladder (10 m native -> 20 -> 60 -> 120 -> 360 -> 720 m; #107, #108) rather
  # than naive halving — every level past the 10 m native is synthetic for
  # S1 either way (there is no native S1 acquisition at 20/60 m), so this
  # buys cross-mission consistency, not fewer objects: an S1 store and an S2
  # store expose the same target-resolution levels, so a viewer/tile server
  # built against one product's pyramid shape works against the other
  # unmodified.
  multiscale_levels: [20, 60, 120, 360, 720]
  # Group VV + VH by shared grid (#108) — they are two measurements of one
  # identical 10 m grid, so this shares one set of coordinate arrays instead
  # of VV and VH each paying for their own copy (#105's measured
  # fragmentation: ~30 of ~48 objects per band were per-level zarr.json +
  # x/y copies).
  bundle_components: true
  scope: product-set              # product (one scene) | product-set (many)
  products:
    prefix: ""
    limit: 3
  samples:
    read: 1
    display: 1
  # GeoZarr display is served by the bench tiler's stock-xarray router at
  # /zarr, not the COG endpoints; set to "geozarr" to compare against its
  # GeoZarrReader-backed router instead (#88).
  display_titiler_path: zarr
  # Same values as example_sentinel1_rtc_cog_zstd.yaml's COG arm (#116) —
  # one tile per target resolution, shared across the format pair so a
  # display_res_60m_latency_mean (etc.) figure is directly comparable, not
  # an accidental mix of two formats' own differently-anchored overview
  # ladders. Matches this arm's own multiscale_levels above.
  display_target_resolutions: [20, 60, 120, 360, 720]
  # Many repeats per tile: a trustworthy per-resolution latency number needs
  # enough samples to average out network noise (#116; was hardcoded to 8).
  display_tile_samples: 30
