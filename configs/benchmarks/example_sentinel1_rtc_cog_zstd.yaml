# Example fan-out benchmark: Sentinel-1 RTC (gamma0) as COG, matched-codec arm (#72).
#
# Identical to example_sentinel1_rtc_cog.yaml except for `codec: zstd`. Run
# alongside example_sentinel1_rtc_geozarr.yaml (also zstd) so the S1 side of the
# GeoZarr-vs-COG size gap is attributable to the format/overviews, not a codec
# mismatch — the same pairing as the S2 MAJA arms. Keep the deflate config as
# the baseline. Also the display comparison partner for that arm (#116): both
# set the *same* display_target_resolutions, so a display_res_60m_latency
# (etc.) figure means the same ground resolution regardless of format — COG's
# own overview ladder (naive halving) wouldn't otherwise land on the same
# resolutions as GeoZarr's #108 target ladder.
id: example-sentinel1-rtc-cog-zstd
dataset: example-sentinel1-rtc
formats:
  - cog
metrics:
  - write
  - object_size
  - read
  - display
tiers:
  - name: warm
    min_object_bytes: 33554432    # 32 MiB
  - name: cold
    min_object_bytes: 104857600   # 100 MiB
params:
  block_size: 512
  codec: zstd                     # matched against the GeoZarr arm's codec
  scope: product-set              # one scene (product) | many (product-set)
  products:
    prefix: ""
    limit: 3
  samples:
    read: 1                       # sample one component per product for read
    display: 1
  # Same values as example_sentinel1_rtc_geozarr.yaml's GeoZarr ladder (#108) —
  # the display comparison's whole point (#116).
  display_target_resolutions: [20, 60, 120, 360, 720]
