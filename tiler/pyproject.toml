[project]
name = "cng-benchmark-tiler"
version = "0.1.0"
description = "Bench TiTiler application: COG, stock-xarray, and GeoZarrReader tile routers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Development Seed" }]
dependencies = [
    "titiler.core>=2.0,<3.0",
    "titiler.xarray>=2.0,<3.0",
    # `titiler.eopf` unconditionally imports its `titiler.cache` submodule
    # (`titiler.eopf.dependencies` -> `titiler.eopf.settings` ->
    # `titiler.cache`), which fails to import without `redis`/`boto3`
    # installed (a class-body type annotation evaluates eagerly). Pull in
    # upstream's own `cache` extra to satisfy that import -- caching itself
    # stays off: `EOPFCacheSettings.enable` defaults to `False` and no
    # `EOPF_CACHE__*` env is set here.
    # v0.10.1 fixes `GeoZarrReader.tile()` reading full native resolution
    # whenever a caller (this app included) omits `tilesize` -- v0.10.0
    # passed `None` straight through instead of falling back to the tile
    # matrix's own size, silently bypassing the multiscale pyramid on
    # every request (#130, fixed upstream in EOPF-Explorer/titiler-eopf#140).
    "titiler.eopf[cache] @ git+https://github.com/EOPF-Explorer/titiler-eopf.git@v0.10.1",
    "rasterio>=1.3",
    "pydantic-settings>=2.0",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cng_benchmark_tiler"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
